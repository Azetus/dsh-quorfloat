[package]
name = "dsh-quorfloat"
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
description = "System-level floating conversation window for DeepSeek Harness"
license = "MIT"
publish = false

# The host supervisor resolves this exact name inside the platform package
# (`dsh-quorfloat-<platform>-<arch>`), so the package name and the binary name
# are the same string on purpose.
[[bin]]
name = "dsh-quorfloat"
path = "src/main.rs"

[lib]
name = "dsh_quorfloat"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The shell. Pinned at >=2.12.1 because `macOSPrivateApi` is a no-op there (the
# transparent-background API is always enabled), which this panel needs for its
# rounded corners — see docs/tauri-shell-spike.md §1. The frontend is embedded at
# compile time through `tauri::generate_context!`, so the staged binary stays a
# single self-contained executable for the host supervisor.
# `tray-icon` puts the panel in the menu bar (the accessory application has no Dock icon on
# purpose); `image-png` decodes the embedded template image at startup.
tauri = { version = ">=2.12.1, <3", features = ["tray-icon", "image-png"] }

# Global hotkey. This is the only way to summon the panel while Harness itself is
# not focused, so it cannot be a window-local key binding. Kept as a plain crate
# rather than the Tauri plugin: the grab is taken *before* the window exists so
# `hello` can report the real outcome, and the plugin needs an AppHandle first.
global-hotkey = "0.8"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
strip = true
lto = "thin"
