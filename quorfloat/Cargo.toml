[package]
name = "dsh-quorfloat"
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
description = "System-level floating conversation window for DeepSeek Harness"
license = "MIT"
publish = false

# The host supervisor resolves this exact name inside the platform package
# (`dsh-quorfloat-<platform>-<arch>`), so the package name and the binary name
# are the same string on purpose.
[[bin]]
name = "dsh-quorfloat"
path = "src/main.rs"

[lib]
name = "dsh_quorfloat"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The window. `default-features = false` drops the accessibility bridge (AccessKit)
# and the default font set: neither is needed for a spotlight-style input panel,
# and both are large. Features are re-added explicitly so an upstream default
# change cannot silently pull them back in.
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

# Global hotkey. This is the only way to summon the panel while Harness itself is
# not focused, so it cannot be a window-local key binding.
global-hotkey = "0.8"
egui-phosphor = { version = "0.14", features = ["fill"] }
egui_commonmark = { version = "0.25", default-features = false }
# The parser `egui_commonmark` itself uses: it reports the byte range of every table, so
# nothing here re-implements Markdown to find them.
pulldown-cmark = { version = "0.13", default-features = false }

[profile.release]
strip = true
lto = "thin"
