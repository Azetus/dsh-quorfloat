<!-- The menu-bar icon: the Harness whale tail.
     Source: the REST_PATH of `RunningWhaleTail` in the Harness client
     (packages/client/ui-chat/src/client/chat/RunningWhaleTail.tsx) — the mark the conversation shows
     while the model runs. It is the panel's own product mark, which is why it belongs in the menu bar.

     Geometry: the path is drawn in a 16x16 space, stroked 1 unit. Its ink runs x 2.6..15.6,
     y 0.6..14.2, so its centre is (9.1, 7.4), not (8, 8) — hence the offset viewBox below, which
     puts that centre in the middle of an 18-unit square (2px of margin at 32px).

     STATUS 2026-10-10: the PNG next to this file IS this whale tail — the user confirmed it in the
     menu bar. Note the accepted render came from the un-offset viewBox (`0 0 16 16`), which leaves
     the tail 4px from the left and flush against the right edge; it looked right in place, but a
     re-render worth keeping should use the centred viewBox below and, if Chrome still lays it out
     wrongly, render at 64x64 and let Pillow centre-and-scale to 32x32 (the headless page layout
     proved unreliable: three attempts came out flush right, flush left/bottom, then identical).
       python3 - <<'EOF'
       svg = open('icons/tray.svg').read().split('-->', 1)[1]
       open('/tmp/tray.html', 'w').write('<!doctype html><body style="margin:0;background:transparent">' + svg + '</body>')
       EOF
       "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --no-sandbox \
         --disable-gpu --hide-scrollbars --disable-lcd-text --default-background-color=00000000 \
         --user-data-dir=/tmp/chrome-tray-profile --window-size=32,32 --virtual-time-budget=4000 \
         --screenshot=tray.png file:///tmp/tray.html
     Chrome writes the file but does not exit; kill it once the PNG appears. -->
