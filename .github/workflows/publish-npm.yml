name: Build and publish npm packages

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Select release version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      main: ${{ steps.version.outputs.main }}
      offline: ${{ steps.version.outputs.offline }}
      darwin: ${{ steps.version.outputs.darwin }}
      win32: ${{ steps.version.outputs.win32 }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - id: version
        run: node scripts/ci.mjs version

  build:
    name: Build ${{ matrix.platform }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin
            runner: macos-15
            targets: aarch64-apple-darwin x86_64-apple-darwin
          - platform: win32
            runner: windows-2022
            targets: x86_64-pc-windows-msvc
    env:
      CARGO_BUILD_JOBS: '2'
      DSH_QUORFLOAT_CARGO_LOCKED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Prepare Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.targets }}
      - name: Prepare MSVC and Windows SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio C++ build tools are missing' }
          & (Join-Path $vs 'Common7/Tools/Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          foreach ($key in @('PATH', 'INCLUDE', 'LIB', 'LIBPATH', 'WindowsSdkDir', 'VCToolsInstallDir')) {
            $value = [Environment]::GetEnvironmentVariable($key)
            if ($value) { "$key=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append }
          }
      - name: Install frontend dependencies
        run: npm --prefix quorfloat/frontend ci --no-audit --no-fund
      - name: Build npm packages
        id: npm
        run: npm run build:npm
      - name: Build offline installation package
        id: offline
        run: npm run build
      - name: Save offline installation package
        if: ${{ !cancelled() && steps.npm.outcome == 'success' && steps.offline.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: offline-${{ matrix.platform }}-${{ needs.version.outputs.version }}
          path: bundles/${{ needs.version.outputs.offline }}-${{ needs.version.outputs.version }}-${{ matrix.platform }}.tgz
          if-no-files-found: error
          retention-days: 14
      - name: Save native npm package
        if: ${{ !cancelled() && steps.npm.outcome == 'success' && steps.offline.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: npm-native-${{ matrix.platform }}-${{ needs.version.outputs.version }}
          path: bundles/npm/${{ needs.version.outputs.version }}/${{ needs.version.outputs[matrix.platform] }}-${{ needs.version.outputs.version }}.tgz
          if-no-files-found: error
          retention-days: 14
      - name: Save main npm package
        if: ${{ !cancelled() && matrix.platform == 'darwin' && steps.npm.outcome == 'success' && steps.offline.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: npm-main-${{ needs.version.outputs.version }}
          path: bundles/npm/${{ needs.version.outputs.version }}/${{ needs.version.outputs.main }}-${{ needs.version.outputs.version }}.tgz
          if-no-files-found: error
          retention-days: 14

      - name: Install dependencies for existing upstream tests
        run: npm install --prefix .tooling/ci --no-save --package-lock=false --ignore-scripts --legacy-peer-deps --no-audit --no-fund @deepseek-ai/cordis@4.0.5-alpha.1 yaml@2.9.1 @deepseek-ai/dsh-api-session-controller@0.2.1-alpha.1
      # Real Tauri/WebView desktop integration runs locally via test:desktop/test.
      - name: Run protocol, upstream and unit tests (no desktop integration)
        timeout-minutes: 20
        run: npm run ci:test

  publish:
    name: Publish native packages, then main package
    needs: [version, build]
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
    concurrency:
      group: dsh-quorfloat-npm-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Prepare npm with Trusted Publishing support
        run: npm install --global npm@12
      - uses: actions/download-artifact@v8
        with:
          name: npm-native-darwin-${{ needs.version.outputs.version }}
          path: .release-artifacts/darwin
      - uses: actions/download-artifact@v8
        with:
          name: npm-native-win32-${{ needs.version.outputs.version }}
          path: .release-artifacts/win32
      - uses: actions/download-artifact@v8
        with:
          name: npm-main-${{ needs.version.outputs.version }}
          path: .release-artifacts/main
      - name: Publish with npm Trusted Publishing
        run: npm run release:publish -- .release-artifacts
